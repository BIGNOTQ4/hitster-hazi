<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hitster Házi – Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .panel {
            background: #1c1c1c;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 16px;
        }

        input,
        select {
            background: #262626;
            color: #fff;
        }

        button {
            margin-top: 12px;
            cursor: pointer;
            background: #fff;
            color: #111;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .spotify-input {
            border-color: #1db954;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .song-item {
            background: #252525;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .song-item strong {
            font-size: 18px;
        }

        .song-meta {
            opacity: 0.8;
            margin-top: 5px;
            font-size: 14px;
        }

        .spotify-ok {
            color: #1ed760;
        }

        .spotify-missing {
            color: #ffb74d;
        }

        .song-actions {
            margin-top: 10px;
        }

        .song-actions button {
            width: auto;
            margin-right: 8px;
            padding-left: 16px;
            padding-right: 16px;
        }

        #cardPreview {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .preview-card {
            width: 63mm;
            height: 88mm;
            background: white;
            color: black;
            border-radius: 4mm;
            border: 1px solid #bbb;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card-front-inner,
        .card-back-inner {
            width: 100%;
            height: 100%;
            padding: 6mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hitster-title {
            font-size: 8mm;
            font-weight: 900;
            margin: 0;
        }

        .hitster-home {
            font-size: 4mm;
            font-weight: bold;
            margin-bottom: 4mm;
        }

        .qr-image {
            width: 42mm;
            height: 42mm;
            object-fit: contain;
        }

        .card-id {
            margin-top: 3mm;
            font-size: 5mm;
            font-weight: bold;
        }

        .year {
            font-size: 16mm;
            font-weight: 900;
            margin-bottom: 8mm;
        }

        .artist {
            font-size: 6mm;
            font-weight: bold;
            margin-bottom: 3mm;
        }

        .title {
            font-size: 5mm;
        }

        .print-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        #printPreview {
            margin-top: 25px;
        }

        .preview-sheet {
            background: white;
            color: black;
            width: 210mm;
            min-height: 297mm;
            margin: 20px auto;
            padding: 12.5mm 6.5mm;
            display: grid;
            grid-template-columns: repeat(3, 63mm);
            grid-template-rows: repeat(3, 88mm);
            gap: 4mm;
            box-shadow: 0 0 10px rgba(0,0,0,.5);
        }

        .print-card {
            width: 63mm;
            height: 88mm;
            border: 0.3mm solid #bbb;
            overflow: hidden;
            background: white;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .empty-slot {
            border: none;
        }

        #printArea {
            display: none;
        }

        @media (max-width: 800px) {
            .form-row,
            .form-row-3,
            .print-controls {
                grid-template-columns: 1fr;
            }
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            body * {
                visibility: hidden !important;
            }

            #printArea,
            #printArea * {
                visibility: visible !important;
            }

            #printArea {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 210mm;
            }

            .print-page {
                width: 210mm;
                height: 297mm;
                padding: 12.5mm 6.5mm;

                display: grid;
                grid-template-columns: repeat(3, 63mm);
                grid-template-rows: repeat(3, 88mm);
                gap: 4mm;

                page-break-after: always;
                break-after: page;
            }

            .print-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .print-card {
                border: 0.3mm solid #aaa;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <h1>♫ HITSTER HÁZI – ADMIN</h1>


    <!-- ==================================================
         ÚJ DAL
         ================================================== -->

    <section class="panel">

        <h2>Új dal hozzáadása</h2>

        <p>
            Következő kártyaszám:
            <strong id="nextCardId">---</strong>
        </p>


        <div class="form-row">

            <div>
                <label for="artist">
                    Előadó
                </label>

                <input
                    id="artist"
                    type="text"
                    placeholder="Pl. Eminem"
                >
            </div>


            <div>
                <label for="title">
                    Dal címe
                </label>

                <input
                    id="title"
                    type="text"
                    placeholder="Pl. Without Me"
                >
            </div>

        </div>


        <div class="form-row">

            <div>
                <label for="year">
                    Megjelenési év
                </label>

                <input
                    id="year"
                    type="number"
                    min="1900"
                    max="2100"
                    placeholder="2002"
                >
            </div>


            <div>
                <label for="spotifyUrl">
                    Spotify dal link
                </label>

                <input
                    id="spotifyUrl"
                    class="spotify-input"
                    type="text"
                    placeholder="https://open.spotify.com/track/..."
                >
            </div>

        </div>


        <label for="youtubeUrl">
            YouTube URL – fallback
        </label>

        <input
            id="youtubeUrl"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
        >


        <div class="form-row-3">

            <div>
                <label for="minStart">
                    Minimum kezdés (mp)
                </label>

                <input
                    id="minStart"
                    type="number"
                    value="20"
                    min="0"
                >
            </div>


            <div>
                <label for="maxStart">
                    Maximum kezdés (mp)
                </label>

                <input
                    id="maxStart"
                    type="number"
                    value="180"
                    min="0"
                >
            </div>


            <div>
                <label for="clipLength">
                    Részlet hossza (mp)
                </label>

                <input
                    id="clipLength"
                    type="number"
                    value="25"
                    min="1"
                >
            </div>

        </div>


        <button id="addSongButton">
            + DAL HOZZÁADÁSA
        </button>

    </section>


    <!-- ==================================================
         SONGS.JSON
         ================================================== -->

    <section class="panel">

        <h2>Daladatbázis</h2>

        <button id="downloadJsonButton">
            ⬇ SONGS.JSON LETÖLTÉSE
        </button>

        <div id="songList"></div>

    </section>


    <!-- ==================================================
         KÁRTYA ELŐNÉZET
         ================================================== -->

    <section class="panel">

        <h2>Kártya előnézet</h2>

        <div id="cardPreview">
            Válassz egy dalt a listából.
        </div>

    </section>


    <!-- ==================================================
         NYOMTATÁS
         ================================================== -->

    <section class="panel">

        <h2>Nyomtatás</h2>

        <label for="flipMode">
            Kétoldalas nyomtatás fordítása
        </label>

        <select id="flipMode">

            <option value="long">
                Hosszú él mentén
            </option>

            <option value="short">
                Rövid él mentén
            </option>

        </select>


        <div class="print-controls">

            <button id="generateTestPrint">
                6 KÁRTYÁS TESZT ELŐNÉZET
            </button>

            <button id="printTest">
                6 KÁRTYÁS TESZT NYOMTATÁSA
            </button>

            <button id="generateAllPrint">
                ÖSSZES KÁRTYA ELŐNÉZETE
            </button>

            <button id="printAll">
                ÖSSZES KÁRTYA NYOMTATÁSA
            </button>

        </div>


        <div id="printPreview">

            <div id="previewPages"></div>

        </div>

    </section>

</div>


<!-- Tényleges nyomtatási terület -->
<div id="printArea"></div>


<script src="admin.js"></script>

</body>

</html>
